# OpenShift Routes. Edge TLS termination: the cluster router serves its own
# configured certificate for each hostname and redirects HTTP to HTTPS. No
# per-application TLS secret is needed (see DEPLOYMENT.md → TLS).

# Portal: the only service behind this Route is nginx (edge proxy).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cryoet
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  host: ai-cryoet.int.janelia.org
  to:
    kind: Service
    name: nginx
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
# mrc-ng-server needs no Route of its own: the browser reaches it via nginx's
# /mrc-ng-server/ location on this same host (see deploy/nginx.conf), so it stays
# a namespace-internal Service. That path prefix + /data is MRCNG_BASE_URL.
