# The catalog scanner runs as a CronJob: it walks the data tree, (re)builds the
# SQLite catalog DB and regenerates thumbnails, then exits. `scan --init --prune`
# (the image's default command) is idempotent, so the same invocation works for
# the first run and steady state; --prune tombstones samples whose folders have
# been deleted from disk so those deletions propagate to the site.
#
# Schedule: hourly, on the hour. Adjust to taste. concurrencyPolicy Forbid
# prevents a long scan from overlapping with the next scheduled run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scanner
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  # Hourly schedule, so 48 = ~48 hours of recent runs kept on the cluster for
  # `kubectl logs`. Durable, searchable scan logs beyond this window live in the
  # catalog DB (scan_log_lines); see the manage-page redesign plan.
  successfulJobsHistoryLimit: 48
  failedJobsHistoryLimit: 48
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # The catalog-data PVC is backed by an NFS PV on the building.prfs
          # filer. Only nodes tagged nfs-dmz=true can reach the filer, so pin
          # the scanner pod there.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nfs-dmz
                        operator: In
                        values:
                          - "true"
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: scanner
              image: ghcr.io/ai-cryoet/ai-cryoet-scanner:latest
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - configMapRef:
                    name: cryoet-config
              volumeMounts:
                - name: catalog-data
                  # Must match CATALOG_DATA_ROOT in the ConfigMap and the API's
                  # mount path — the scanner records absolute paths under this
                  # root that the API later resolves.
                  mountPath: /groups/cryoet/cryoet/data
                  readOnly: true
                - name: catalog-db
                  mountPath: /db
                - name: thumbnails
                  mountPath: /thumbnails
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
          volumes:
            - name: catalog-data
              persistentVolumeClaim:
                claimName: catalog-data-pvc
                readOnly: true
            - name: catalog-db
              persistentVolumeClaim:
                claimName: catalog-db-pvc
            - name: thumbnails
              persistentVolumeClaim:
                claimName: thumbnails-pvc
