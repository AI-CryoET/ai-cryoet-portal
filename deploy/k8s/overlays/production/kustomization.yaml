apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-cryoet

resources:
  - ../../base
  - namespace.yaml

# Non-sensitive configuration shared by the api and scanner. Copy
# config.env.example to config.env and edit before deploying. config.env is
# gitignored and must not be committed.
configMapGenerator:
  - name: cryoet-config
    envs:
      - config.env

generatorOptions:
  disableNameSuffixHash: true

# The base PVCs intentionally omit storageClassName because the right class is
# cluster-specific. On this OpenShift/OCS cluster the default class
# (ocs-storagecluster-ceph-rbd) is RBD block storage, which only supports
# ReadWriteOnce in Filesystem mode and rejects the ReadWriteMany access mode
# these volumes need. ocs-storagecluster-cephfs is the shared CephFS class and
# supports it. Pin the RWX PVCs (catalog-db, thumbnails, mrc-cache) to it here.
# catalog-data binds statically (storageClassName: "") and is not patched.
patches:
  - target:
      kind: PersistentVolumeClaim
      name: catalog-db-pvc
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: ocs-storagecluster-cephfs
  - target:
      kind: PersistentVolumeClaim
      name: thumbnails-pvc
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: ocs-storagecluster-cephfs
  - target:
      kind: PersistentVolumeClaim
      name: mrc-cache-pvc
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: ocs-storagecluster-cephfs

# Pin to the version built by the `v*.*.*` git tag. The metadata-action strips
# the leading `v`, so git tag `v1.0.0` publishes image tag `1.0.0` (no `v`).
# mrc-ng-server is built and versioned in its own repo, so it tracks its own
# tag independently of the 1.x portal images.
images:
  - name: ghcr.io/ai-cryoet/ai-cryoet-api
    newTag: "2.1.1"
  - name: ghcr.io/ai-cryoet/ai-cryoet-frontend
    newTag: "2.1.1"
  - name: ghcr.io/ai-cryoet/ai-cryoet-scanner
    newTag: "2.1.1"
  - name: ghcr.io/janeliascicomp/mrc-ng-server
    newTag: "0.1.4"
